name: AWEC Runtime Fix

on:
  push:
    branches: [AWEC]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch crawler runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, transform):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              n = transform(s)
              if n == s:
                  print(f"NO CHANGE: {path}")
              else:
                  p.write_text(n, encoding="utf-8")
                  print(f"PATCHED: {path}")

          def crawler(s):
              old = 'if self.policy.follow_links and item["depth"] < self.policy.max_depth: discovered = ContentExtractor.extract_html_links(res.final_url, body)'
              new = 'if self.policy.follow_links and (self.policy.max_depth <= 0 or item["depth"] < self.policy.max_depth): discovered = ContentExtractor.extract_html_links(res.final_url, body)'
              if old in s:
                  s = s.replace(old, new, 1)
              else:
                  old2 = 'if self.policy.follow_links and item["depth"] < self.policy.max_depth:\n                discovered = ContentExtractor.extract_html_links(res.final_url, body)'
                  new2 = 'if self.policy.follow_links and (self.policy.max_depth <= 0 or item["depth"] < self.policy.max_depth):\n                discovered = ContentExtractor.extract_html_links(res.final_url, body)'
                  s = s.replace(old2, new2, 1)
              return s

          patch("desktop/crawler_engine.py", crawler)
          patch("desktop/crawler_engine_v12.py", crawler)

          # Make scope behavior honor include_subdomains instead of silently
          # treating every non-external crawl as same-site.
          def scope(s):
              old = '''    def _in_scope(self, url: str, embedded_kind: str = "") -> bool:\n        host = (urlparse(url).hostname or "").lower()\n        if not host: return False\n        if embedded_kind in self.EMBEDDED_RESOURCE_KINDS: return True\n        if self.policy.follow_external_domains: return True\n        return any(self._same_site(host, urlparse(seed).hostname or "") for seed in self.seeds)'''
              new = '''    def _in_scope(self, url: str, embedded_kind: str = "") -> bool:\n        host = (urlparse(url).hostname or "").lower()\n        if not host:\n            return False\n        if embedded_kind in self.EMBEDDED_RESOURCE_KINDS:\n            return True\n        if self.policy.follow_external_domains:\n            return True\n        for seed in self.seeds:\n            seed_host = (urlparse(seed).hostname or "").lower()\n            if self.policy.include_subdomains:\n                if self._same_site(host, seed_host):\n                    return True\n            elif self._registrable_host(host) == self._registrable_host(seed_host):\n                return True\n        return False'''
              return s.replace(old, new, 1)

          patch("desktop/crawler_engine.py", scope)

          # Keep the IA collection from disappearing between UI preflight and
          # the actual resumable crawler construction.
          ep = Path("desktop/engine.py")
          es = ep.read_text(encoding="utf-8")
          if 'collection=getattr(self.cfg,\'ia_collection\',\'\')' in es:
              es = es.replace(
                  "collection=getattr(self.cfg,'ia_collection',''),",
                  "collection=(getattr(self.cfg,'ia_collection','') or __import__('os').environ.get('AWEC_IA_COLLECTION','')).strip(),"
                  )
          elif "collection=getattr(self.cfg,'ia_collection','')" in es:
              es = es.replace(
                  "collection=getattr(self.cfg,'ia_collection','')",
                  "collection=(getattr(self.cfg,'ia_collection','') or __import__('os').environ.get('AWEC_IA_COLLECTION','')).strip()"
                  )
          ep.write_text(es, encoding="utf-8")
          print("PATCHED: desktop/engine.py")

      - name: Validate
        run: |
          python -m py_compile desktop/crawler_engine.py desktop/crawler_engine_v12.py desktop/engine.py
          grep -n 'max_depth <= 0' desktop/crawler_engine.py
          grep -n 'max_depth <= 0' desktop/crawler_engine_v12.py
          grep -n 'AWEC_IA_COLLECTION' desktop/engine.py

      - name: Commit runtime fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/crawler_engine.py desktop/crawler_engine_v12.py desktop/engine.py .github/workflows/_awec_runtime_fix.yml
          git rm -f .github/workflows/_awec_runtime_fix.yml
          git diff --cached --check
          git commit -m "fix: recursive site discovery and IA collection propagation"
          git push
