name: AWEC Desktop Builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AWEC-Windows
          - os: ubuntu-latest
            artifact: AWEC-Linux
          - os: macos-latest
            artifact: AWEC-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name AWEC desktop/awec_desktop.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/AWEC/
